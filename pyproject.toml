version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TharsikanV", email = "108121067+TharsikanV@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.1",
    "langchain-groq>=1.1.3",
